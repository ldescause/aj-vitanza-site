    <!-- Structured Data. /merch is the link that gets shared, so it carries
         the Product node too. Price and availability are rewritten by
         merch.js from MERCH_CONFIG on load — don't hand-edit them here.
         The offer's url points at this page, not the homepage. -->
    <script type="application/ld+json" id="ld-graph">
    {
        "@context": "https://schema.org",
        "@graph": [
            {
                "@type": "MusicGroup",
                "@id": "https://ajvitanza.com/#artist",
                "name": "AJ Vitanza",
                "url": "https://ajvitanza.com"
            },
            {
                "@type": "Product",
                "@id": "https://ajvitanza.com/#tee",
                "name": "AJ Vitanza Debut T-Shirt",
                "description": "Heavyweight cotton tee in black. Limited 50-unit presale — every order includes a graphic card signed by AJ.",
                "image": [
                    "https://ajvitanza.com/images/merch/tee-front.jpg",
                    "https://ajvitanza.com/images/merch/tee-back.jpg"
                ],
                "brand": { "@id": "https://ajvitanza.com/#artist" },
                "offers": {
                    "@type": "Offer",
                    "url": "https://ajvitanza.com/merch",
                    "priceCurrency": "USD",
                    "price": "50.00",
                    "availability": "https://schema.org/InStock",
                    "seller": { "@id": "https://ajvitanza.com/#artist" }
                }
            }
        ]
    }
    </script>

            <div class="merch-meta" hidden>

                    <div class="merch-countdown-clock">

                    </div>
                    <span class="merch-countdown-venue"></span>
                </div>

                <div class="merch-counter" hidden data-reveal>
                    <span class="merch-meta-label">Stock remaining</span>
                    <div class="merch-counter-head">
                        <span class="merch-counter-num">—</span>
                        <span class="merch-counter-total"></span>
                    </div>
                    <div class="merch-counter-bar">
                        <div class="merch-counter-fill"></div>
                    </div>
                </div>
            </div>

            <div class="merch-grid"></div>

            <p class="merch-shipping-note" data-reveal></p>
        </div>
    </section>
